<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Spaarow Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="referrer" content="no-referrer">
    <meta name="cache-control" content="no-transform">

    <style>
        .navbar {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(107, 70, 193, 0.2);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #6b46c1;
            font-weight: 700;
            font-size: 20px;
            text-decoration: none;
        }

        .back-button {
            background: rgba(107, 70, 193, 0.2);
            border: 1px solid #6b46c1;
            color: #6b46c1;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-button:hover {
            background: rgba(107, 70, 193, 0.3);
        }

        .profile-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .refresh-button {
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #3b82f6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .refresh-button:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: translateY(-1px);
        }

        .refresh-button i {
            transition: transform 0.3s ease;
        }

        .refresh-button:hover i {
            transform: rotate(180deg);
        }

        .profile-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .edit-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #6b46c1, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .profile-avatar {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.25);
            object-fit: cover;
            background: rgba(255, 255, 255, 0.05);
        }

        .profile-info {
            margin-bottom: 30px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row label {
            font-weight: 600;
            color: #999;
            font-size: 14px;
        }

        .info-row p {
            margin: 0;
            color: #fff;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat {
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 32px;
            color: #6b46c1;
            margin-bottom: 5px;
        }

        .stat small {
            color: #999;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0a0a0a;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6b46c1;
            box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.1);
        }

        .avatar-preview {
            margin-top: 10px;
            text-align: center;
        }

        .avatar-preview img {
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6b46c1;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-primary,
        .btn-secondary {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6b46c1, #8b5cf6);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .readings-section {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 24px;
        }

        .section-header select {
            padding: 8px 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0a0a0a;
            color: #fff;
            font-size: 14px;
        }

        .readings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .reading-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .reading-card:hover {
            transform: translateY(-5px);
            border-color: #6b46c1;
            box-shadow: 0 8px 20px rgba(107, 70, 193, 0.2);
        }

        .reading-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .reading-header h3 {
            margin: 0;
            font-size: 16px;
            color: #fff;
        }

        .reading-date {
            font-size: 12px;
            color: #999;
        }

        .reading-preview {
            color: #b0b0b0;
            font-size: 14px;
            margin: 10px 0;
        }

        .reading-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .reading-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s ease;
        }

        .reading-actions button:hover {
            background: #6b46c1;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .preferences-message {
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .preferences-message.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .preferences-message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .hidden {
            display: none !important;
        }

        /* Toast animations */
        .toast {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Reading Modal Styles */
        .reading-modal .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .reading-modal .modal-content {
            position: relative;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            margin: 20px;
        }

        .reading-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .reading-modal .modal-header h3 {
            margin: 0;
            color: #fff;
            font-size: 24px;
        }

        .reading-modal .modal-close {
            background: none;
            border: none;
            color: #999;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .reading-modal .modal-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .reading-modal .reading-date {
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .reading-modal .reading-content {
            color: #fff;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Form hint text */
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation">
        <div class="floating-orb orb-1"></div>
        <div class="floating-orb orb-2"></div>
        <div class="floating-orb orb-3"></div>
        <div class="floating-orb orb-4"></div>
        <div class="floating-orb orb-5"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="logo">Spaarow Hub</a>
            <button class="back-button" onclick="window.history.back()">← Back</button>
        </div>
    </nav>

    <!-- Profile Content -->
    <main class="main-content">
        <section class="profile-section">
            <div class="profile-header">
                <h1>My Profile</h1>
                <div class="header-actions">
                    <button class="refresh-button" id="refreshButton" onclick="refreshProfileData()" title="Refresh profile data">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <button class="edit-button" id="editButton" onclick="toggleEditMode()">Edit Profile</button>
                </div>
            </div>

            <!-- Profile View Mode -->
            <div id="profileViewMode" class="profile-card">
                <div class="profile-avatar">
                    <img id="avatarImage" src="../asset/img/avatar-placeholder.svg" alt="Avatar" class="profile-avatar-img">
                </div>

                <div class="profile-info">
                    <div class="info-row">
                        <label>Display Name</label>
                        <p id="displayNameView">-</p>
                    </div>
                    <div class="info-row">
                        <label>Username</label>
                        <p id="usernameView">-</p>
                    </div>
                    <div class="info-row">
                        <label>Email</label>
                        <p id="emailView">-</p>
                    </div>
                    <div class="info-row">
                        <label>Birth Date</label>
                        <p id="birthDateView">Not set</p>
                    </div>
                    <div class="info-row">
                        <label>Zodiac Sign</label>
                        <p id="zodiacView">Not detected</p>
                    </div>
                    <div class="info-row">
                        <label>Bio</label>
                        <p id="bioView">-</p>
                    </div>
                    <div class="info-row">
                        <label>Joined</label>
                        <p id="joinedView">-</p>
                    </div>
                </div>

                <!-- Stats -->
                <div class="profile-stats">
                    <div class="stat">
                        <strong id="totalReadings">0</strong>
                        <small>Total Readings</small>
                    </div>
                    <div class="stat">
                        <strong id="favoriteReadings">0</strong>
                        <small>Favorites</small>
                    </div>
                </div>
            </div>

            <!-- Profile Edit Mode -->
            <div id="profileEditMode" class="profile-card hidden">
                <form id="profileForm">
                            <div class="form-group">
                        <label for="avatarUpload">Avatar</label>
                        <input type="file" id="avatarUpload" accept="image/png, image/jpeg, image/webp" onchange="previewAvatar(event)">
                        <p class="hint">Max 2MB. PNG/JPG/WEBP only.</p>
                        <div id="avatarPreview" class="avatar-preview" style="display: none;">
                            <img id="avatarPreviewImg" src="" alt="Avatar preview" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #6b46c1;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="displayNameEdit">Display Name</label>
                        <input type="text" id="displayNameEdit" required>
                    </div>
                    <div class="form-group">
                        <label for="bioEdit">Bio</label>
                        <textarea id="bioEdit" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="birthDateEdit">Birth Date</label>
                        <input type="date" id="birthDateEdit">
                    </div>
                    <div class="form-group">
                        <label for="zodiacEdit">Zodiac Sign</label>
                        <select id="zodiacEdit">
                            <option value="">Not specified</option>
                            <option value="Aries">Aries</option>
                            <option value="Taurus">Taurus</option>
                            <option value="Gemini">Gemini</option>
                            <option value="Cancer">Cancer</option>
                            <option value="Leo">Leo</option>
                            <option value="Virgo">Virgo</option>
                            <option value="Libra">Libra</option>
                            <option value="Scorpio">Scorpio</option>
                            <option value="Sagittarius">Sagittarius</option>
                            <option value="Capricorn">Capricorn</option>
                            <option value="Aquarius">Aquarius</option>
                            <option value="Pisces">Pisces</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Changes</button>
                        <button type="button" class="btn-secondary" onclick="toggleEditMode()">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Preferences Section -->
            <section class="preferences-section" id="preferencesSection">
                <div class="section-header">
                    <h2>Preferences</h2>
                    <span class="section-subtitle">Manage account settings and notifications.</span>
                </div>

                <div class="preferences-card">
                    <form id="preferencesForm">
                        <div class="form-group">
                            <label for="themeSelect">Theme</label>
                            <select id="themeSelect">
                                <option value="dark">Dark</option>
                                <option value="light">Light</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="notificationsToggle">Notifications</label>
                            <select id="notificationsToggle">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="emailFrequency">Email Frequency</label>
                            <select id="emailFrequency">
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="languageSelect">Language</label>
                            <select id="languageSelect">
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                            </select>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Save Preferences</button>
                        </div>

                        <div id="preferencesMessage" class="preferences-message"></div>
                    </form>
                </div>
            </section>

        </section>

        <!-- Reading History Section -->
        <section class="readings-section">
            <div class="section-header">
                <h2>My Readings</h2>
                <select id="toolFilter" onchange="filterReadings()">
                    <option value="">All Tools</option>
                    <option value="tarot-reading">Tarot</option>
                    <option value="dream-interpreter">Dreams</option>
                    <option value="zodiac-calculator">Zodiac</option>
                    <option value="numerology">Numerology</option>
                    <option value="rune-casting">Runes</option>
                    <option value="crystal-healing">Crystals</option>
                    <option value="fortune-teller">Fortune</option>
                    <option value="birth-charts">Birth Chart</option>
                    <option value="love-language-quiz">Love Quiz</option>
                </select>
            </div>

            <div id="readingsGrid" class="readings-grid">
                <p class="no-data">Loading your readings...</p>
            </div>
        </section>
    </main>

    <script>
        // Cache-busting helper
        function loadScript(src) {
            const script = document.createElement('script');
            script.src = src + '?v=' + Date.now();
            document.head.appendChild(script);
        }
        
        function loadStylesheet(href) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href + '?v=' + Date.now();
            document.head.appendChild(link);
        }
        
        // Force refresh on page load to get latest data
        function forceRefresh() {
            // Add timestamp to prevent caching
            if (!window.location.search.includes('force=')) {
                const url = new URL(window.location);
                url.searchParams.set('force', Date.now());
                window.location.replace(url.toString());
                return false; // Stop further execution
            }
            return true;
        }
        
        // Only proceed if not redirecting
        if (forceRefresh()) {
            // Load resources with cache-busting
            loadStylesheet('../asset/css/main.css');
            loadScript('../asset/js/auth.js');
            loadScript('../asset/js/profile.js');
        }
    </script>
</body>
</html>
